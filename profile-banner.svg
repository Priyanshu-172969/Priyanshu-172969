<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="banner-title banner-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="banner-title">Priyanshu Kr Bid, B.Tech undergraduate</title>
  <desc id="banner-desc">Name banner: B.Tech Undergraduate focused on software development, data science and AI/ML. An arch drawn over a small bar chart sits on the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#131C36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <linearGradient id="accent-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3556" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="none" stroke="#24304D"/>

  <rect x="56" y="58" width="4" height="124" rx="2" fill="url(#accent-v)"/>
  <g font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="84" y="112" font-size="56" font-weight="700" fill="#E6EDF7" letter-spacing="-1">Priyanshu Kr Bid</text>
    <text x="86" y="150" font-size="18" font-weight="500" fill="#4CC9F0" textLength="620" lengthAdjust="spacingAndGlyphs">B.Tech Undergraduate  |  Software Development  |  Data Science  |  AI/ML</text>
    <text x="86" y="180" font-size="16" fill="#8B98B5" textLength="700" lengthAdjust="spacingAndGlyphs">Building practical solutions, exploring data, and strengthening my technical foundations.</text>
  </g>

  <g transform="translate(60,0)">
    <g fill="none" stroke-linecap="round">
      <path d="M770 200 H1110" stroke="#2A3556" stroke-width="1.5"/>
      <path d="M790 200 A150 150 0 0 1 1090 200" stroke="url(#accent)" stroke-width="2" opacity="0.30"/>
      <path d="M830 200 A110 110 0 0 1 1050 200" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
      <path d="M870 200 A70 70 0 0 1 1010 200" stroke="url(#accent)" stroke-width="2.5"/>
    </g>
    <circle cx="790" cy="200" r="4" fill="#4CC9F0"/>
    <circle cx="1090" cy="200" r="4" fill="#8B7CF6"/>
    <g>
      <rect x="898" y="184" width="9" height="16" rx="1.5" fill="#4CC9F0" opacity="0.35"/>
      <rect x="913" y="174" width="9" height="26" rx="1.5" fill="#4CC9F0" opacity="0.45"/>
      <rect x="928" y="180" width="9" height="20" rx="1.5" fill="#4CC9F0" opacity="0.55"/>
      <rect x="943" y="164" width="9" height="36" rx="1.5" fill="#4CC9F0" opacity="0.70"/>
      <rect x="958" y="170" width="9" height="30" rx="1.5" fill="#4CC9F0" opacity="0.85"/>
      <rect x="973" y="156" width="9" height="44" rx="1.5" fill="#8B7CF6"/>
    </g>
  </g>
</svg>
