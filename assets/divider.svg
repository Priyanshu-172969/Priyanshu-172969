<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2" viewBox="0 0 1200 2" role="img" aria-labelledby="t d">
<title id="t">Section divider</title><desc id="d">A thin cyan-to-violet gradient divider with a slow moving highlight.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE" stop-opacity=".4"/><stop offset=".5" stop-color="#3B82F6" stop-opacity=".4"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".4"/></linearGradient>
  <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="2" fill="url(#base)"/>
<rect class="shine" x="-180" y="0" width="180" height="2" fill="url(#shineg)"/>
<style>
@keyframes shimmer{from{transform:translateX(0)}to{transform:translateX(1380px)}}
.shine{animation:shimmer 9s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</svg>