<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
<title id="title">Priyanshu Kr Bid | Data Science and Software Development</title>
<desc id="desc">A restrained dark banner with the name Priyanshu Kr Bid, undergraduate headline, Build analyze learn tagline, and a subtle animated analytics sparkline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0B0F19"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="cyan"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#8B5CF6" stop-opacity=".14"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
</defs>
<rect width="1280" height="300" rx="16" fill="url(#bg)"/>
<rect width="1280" height="300" rx="16" fill="url(#grid)"/>
<g filter="url(#blur)">
  <circle class="glow-cyan" cx="120" cy="50" r="128" fill="url(#cyan)"/>
  <circle class="glow-violet" cx="1160" cy="260" r="148" fill="url(#violet)"/>
</g>
<rect x=".5" y=".5" width="1279" height="299" rx="15.5" fill="none" stroke="#243049"/>
<g font-family="ui-sans-serif,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif">
  <text x="76" y="122" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#E6EDF3">Priyanshu Kr Bid</text>
  <text x="78" y="165" font-size="18" font-weight="500" fill="#9AA7B8">B.Tech Undergraduate  |  Software Development  |  Data Science  |  AI/ML</text>
  <text x="78" y="204" font-size="14" fill="#9AA7B8">Build · analyze · learn.</text>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M826 205 L884 177 L932 189 L985 133 L1035 150 L1090 96 L1153 111 L1202 70" stroke="url(#accent)" stroke-width="2.5" opacity=".55"/>
  <path d="M826 205 L884 177 L932 189 L985 133 L1035 150 L1090 96 L1153 111 L1202 70" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="520" stroke-dashoffset="520" class="draw"/></path>
  <path d="M826 205 L884 177 L932 189 L985 133 L1035 150 L1090 96 L1153 111 L1202 70" stroke="url(#accent)" stroke-width="5" opacity="0" class="soft-pulse"/></path>
</g>
<g fill="#22D3EE">
  <circle class="node node-1" cx="826" cy="205" r="4"/>
  <circle class="node node-2" cx="932" cy="189" r="4"/>
  <circle class="node node-3" cx="1035" cy="150" r="4"/>
  <circle class="node node-4" cx="1153" cy="111" r="4"/>
  <circle class="node node-5" cx="1202" cy="70" r="4" fill="#8B5CF6"/>
</g>
<g stroke="#243049" stroke-width="1" opacity=".8"><path d="M826 230H1202"/><path d="M826 112H1202" stroke-dasharray="3 7"/></g>
<style>
@keyframes spark-draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes spark-glow{0%,100%{opacity:0}50%{opacity:.10}}
@keyframes node-pulse{0%,100%{opacity:.25}50%{opacity:.8}}
@keyframes cyan-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(35px,18px)}}
@keyframes violet-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,-14px)}}
.draw{animation:spark-draw 2.4s ease-in-out 0s 1 forwards}
.soft-pulse{animation:spark-glow 8s ease-in-out 2.4s infinite}
.node-1{animation:node-pulse 5s ease-in-out 0s infinite}
.node-2{animation:node-pulse 6s ease-in-out 1s infinite}
.node-3{animation:node-pulse 7s ease-in-out 2s infinite}
.node-4{animation:node-pulse 8s ease-in-out 3s infinite}
.node-5{animation:node-pulse 9s ease-in-out 4s infinite}
.glow-cyan{transform-box:fill-box;transform-origin:center;animation:cyan-drift 18s ease-in-out infinite}
.glow-violet{transform-box:fill-box;transform-origin:center;animation:violet-drift 18s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</svg>