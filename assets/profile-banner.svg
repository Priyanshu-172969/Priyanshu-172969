  <path d="M826 205 L884 177 L932 189 L985 133 L1035 150 L1090 96 L1153 111 L1202 70" stroke="url(#accent)" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;.10;0" dur="8s" begin="2.4s" repeatCount="indefinite"/></path>
</g>
<g fill="#22D3EE">
