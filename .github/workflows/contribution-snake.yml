name: Generate contribution snake

on:
  # Rebuild every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:
  # Also rebuild when you change this workflow
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

# No permissions by default; the job below asks for the one it needs.
permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to push the SVGs to the "output" branch
    steps:
      - name: Build snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4CC9F0&color_dots=#161B22,#12394d,#1b6a8a,#2e9bc2,#4cc9f0

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
