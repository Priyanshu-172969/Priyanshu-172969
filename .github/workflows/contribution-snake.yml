name: Generate profile assets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions: {}

concurrency:
  group: profile-assets-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the output branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: output
          fetch-depth: 0

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Build light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4CC9F0&color_dots=#161B22,#12394d,#1b6a8a,#2e9bc2,#4cc9f0

      - name: Add accessible labels and reduced-motion support to snakes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ("github-snake.svg", "github-snake-dark.svg"):
              path = Path("dist") / name
              svg = path.read_text(encoding="utf-8")
              if "<title" not in svg:
                  svg = svg.replace(
                      "<svg ",
                      '<svg role="img" aria-labelledby="snakeTitle snakeDesc" ',
                      1,
                  )
                  svg = svg.replace(
                      "><desc>",
                      '><title id="snakeTitle">GitHub contribution snake</title>'
                      '<desc id="snakeDesc">A visual representation of GitHub contribution activity.</desc>',
                      1,
                  )
              if "prefers-reduced-motion: reduce" not in svg:
                  svg = svg.replace(
                      "</style>",
                      "@media (prefers-reduced-motion: reduce){*{animation:none!important}}\n</style>",
                      1,
                  )
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
          AUTO_PUSH: false
          THEME: tokyonight

      - name: Add accessible labels to the language card
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-summary-card-output/tokyonight/1-repos-per-language.svg")
          svg = path.read_text(encoding="utf-8")
          match = re.search(r"<svg\b[^>]*>", svg)
          if match and "<title" not in svg:
              root = match.group(0).replace(
                  "<svg ",
                  '<svg role="img" aria-labelledby="languagesTitle languagesDesc" ',
                  1,
              )
              svg = svg.replace(
                  match.group(0),
                  root
                  + '<title id="languagesTitle">Top Languages by Repository</title>'
                  + '<desc id="languagesDesc">Repository language distribution generated from public GitHub repository data.</desc>',
                  1,
              )
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Stage language cards for the output branch
        run: |
          mkdir -p dist/profile-summary-card-output/tokyonight
          cp profile-summary-card-output/tokyonight/1-repos-per-language.svg dist/profile-summary-card-output/tokyonight/

      - name: Publish generated assets without rewriting history
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
